title: Ali Cabukel
title_separator: "|"
subtitle: Lead AI Engineer · production LLM systems, agents and ML platforms
description: >-
  Ali Cabukel — Lead AI Engineer in London. Experience, projects, open
  source work and build logs on GenAI, agents, MLOps and real-world data apps.
url: "https://ali-cabukel.github.io"
baseurl: ""
repository: "ali-cabukel/ali-cabukel.github.io"

remote_theme: mmistakes/minimal-mistakes@4.26.2
minimal_mistakes_skin: "air"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache


locale: "en-US"
timezone: Europe/London

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

permalink: /:categories/:year-:month-:day-:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      toc: true
      toc_sticky: true

author:
  name: Ali Cabukel
  # avatar: "/assets/images/avatar.jpg"  # TODO: add a photo and uncomment
  bio: "Lead AI Engineer in London. ML and GenAI at Vodafone Group."
  location: "London, UK"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/alicabukel"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ali-cabukel"
    - label: "kayrazen.io"
      icon: "fas fa-fw fa-link"
      url: "https://kayrazen.io"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/alicabukel"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ali-cabukel"
    - label: "tissue-bot"
      icon: "fas fa-fw fa-code-branch"
      url: "https://github.com/ali-cabukel/tissue-bot"

include:
  - _pages

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
